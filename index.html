<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OwnPDF is a private, local-first PDF toolkit. Unlock, protect, merge, split, organize, convert, and inspect PDFs 100% on your device with zero server uploads." />
    <title>OwnPDF — Your PDFs. Your device. Your privacy.</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ownpdf_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F7FBFF] text-[#0F1B2D] antialiased dark:bg-[#07111F] dark:text-[#F0F8FF] transition-colors duration-200 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

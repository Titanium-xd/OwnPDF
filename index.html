<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="canonical" href="https://titanium-xd.github.io/OwnPDF/" />
    <title>OwnPDF — Free Private PDF Tools</title>
    <meta name="description" content="Free, private, local-first PDF toolkit with 26 browser-based tools. Unlock e-Aadhaar, protect, merge, split, compress, redact, edit, and convert PDFs 100% on your device with zero uploads." />
    <meta name="robots" content="index, follow" />
    <meta name="google-site-verification" content="A5HBnMzskxpYN049quXzj_7v-FKCmpSW1K9g_xfbwvM" />

    <!-- Theme Colors -->
    <meta name="theme-color" content="#F7FBFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07111F" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#0284c7" />

    <!-- Favicons & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo.png" />
    <link rel="apple-touch-icon" href="/ownpdf-mascot.png" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://titanium-xd.github.io/OwnPDF/" />
    <meta property="og:title" content="OwnPDF — Free Private PDF Tools" />
    <meta property="og:description" content="Free, private, local-first PDF toolkit with 26 browser-based tools. Unlock e-Aadhaar, protect, merge, split, compress, redact, edit, and convert PDFs 100% on your device with zero uploads." />
    <meta property="og:image" content="https://titanium-xd.github.io/OwnPDF/ownpdf-mascot.png" />
    <meta property="og:image:alt" content="OwnPDF Mascot" />
    <meta property="og:site_name" content="OwnPDF" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://titanium-xd.github.io/OwnPDF/" />
    <meta name="twitter:title" content="OwnPDF — Free Private PDF Tools" />
    <meta name="twitter:description" content="Free, private, local-first PDF toolkit with 26 browser-based tools. Unlock e-Aadhaar, protect, merge, split, compress, redact, edit, and convert PDFs 100% on your device with zero uploads." />
    <meta name="twitter:image" content="https://titanium-xd.github.io/OwnPDF/ownpdf-mascot.png" />
    <meta name="twitter:image:alt" content="OwnPDF Mascot" />

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ownpdf_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F7FBFF] text-[#0F1B2D] antialiased dark:bg-[#07111F] dark:text-[#F0F8FF] transition-colors duration-200 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
